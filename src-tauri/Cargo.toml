[package]
name = "dienstenlezer"
version = "1.4.1"
description = "Diensten-pdf lezer met webbackend en Qbuzz live status"
authors = ["DienstenLezer"]
edition = "2021"

[[bin]]
name = "dienstenlezer-server"
path = "src/bin/dienstenlezer-server.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
futures-util = "0.3"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2.2"
