name: Publiceer Home Assistant-image

on:
  workflow_dispatch:
  push:
    tags:
      - "ha-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Bouw ARM64-image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v6.0.2

      - name: Versie en imagenaam bepalen
        id: info
        shell: bash
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dienstenlezer" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx instellen
        uses: docker/setup-buildx-action@v4

      - name: Aanmelden bij GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Native image bouwen en publiceren
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.info.outputs.version }}
            BUILD_ARCH=aarch64
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          cache-from: type=gha,scope=ha-arm64
          cache-to: type=gha,scope=ha-arm64,mode=max
          provenance: false

      - name: Gepubliceerd image opstarten
        shell: bash
        run: |
          image="${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}"
          container="dienstenlezer-smoke-arm64"
          trap 'docker rm --force --volumes "$container" >/dev/null 2>&1 || true' EXIT

          docker pull "$image"
          docker run --detach --name "$container" --publish 127.0.0.1:18080:8080 "$image"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              exit 0
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
              docker logs "$container"
              exit 1
            fi

            sleep 1
          done

          docker logs "$container"
          exit 1
